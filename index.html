<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeux d'Oliv</title>
<meta name="description" content="Réservez votre place aux parties de jeux de société.">
<meta name="theme-color" content="#0B0D1F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E6ECF8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeux d'Oliv">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Jeux d'Oliv. Plan : ludothèque colorée (boutons stickers, couleurs d'éditeur) + verre dépoli (affiche du jeu floutée derrière chaque carte). Tout vient des jetons ci-dessous. */
:root{
  --bg:#E6ECF8; --ink:#15132E; --muted:#56547A; --dot:rgba(21,19,46,.17);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.9); --edge:rgba(255,255,255,.92); --hl:rgba(255,255,255,.75);
  --hair:rgba(21,19,46,.15); --shadow:rgba(46,52,140,.26); --scrim:rgba(14,14,42,.52);
  --sun:#FFC22E; --on-sun:#15132E; --sun-edge:#15132E; --sun-soft:rgba(255,194,46,.38);
  --tomato:#E4381F; --on-tomato:#FFFFFF; --tomato-edge:#15132E;
  --teal:#0A9A89; --on-teal:#FFFFFF; --teal-edge:#15132E;
  --cobalt:#2A45E6; --pink:#FF8EC0;
  --ok:#0B8A68; --warn:#A86B00; --bad:#CF2E17;
  --stroke:#15132E; --blob:.5;
  --p0:#E4381F; --p1:#F2A900; --p2:#0A9A89; --p3:#2A45E6; --p4:#E8589E;
  --font-d:'Bricolage Grotesque','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-b:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D1F; --ink:#F3F1FF; --muted:#A8A6C8; --dot:rgba(255,255,255,.15);
    --glass:rgba(28,30,64,.58); --glass-2:rgba(22,24,52,.92); --edge:rgba(255,255,255,.15); --hl:rgba(255,255,255,.10);
    --hair:rgba(255,255,255,.17); --shadow:rgba(0,0,0,.6); --scrim:rgba(4,4,18,.66);
    --sun:#FFC93C; --on-sun:#171230; --sun-edge:#A87400; --sun-soft:rgba(255,201,60,.30);
    --tomato:#FF6B55; --on-tomato:#210A05; --tomato-edge:#A12612;
    --teal:#2DD4BF; --on-teal:#04201C; --teal-edge:#0B7F72;
    --cobalt:#8A97FF; --pink:#FF9BC8;
    --ok:#3FE0AE; --warn:#FFC93C; --bad:#FF8570;
    --stroke:rgba(0,0,0,.55); --blob:.3;
    --p0:#FF6B55; --p1:#FFC93C; --p2:#2DD4BF; --p3:#8A97FF; --p4:#FF9BC8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D1F; --ink:#F3F1FF; --muted:#A8A6C8; --dot:rgba(255,255,255,.15);
  --glass:rgba(28,30,64,.58); --glass-2:rgba(22,24,52,.92); --edge:rgba(255,255,255,.15); --hl:rgba(255,255,255,.10);
  --hair:rgba(255,255,255,.17); --shadow:rgba(0,0,0,.6); --scrim:rgba(4,4,18,.66);
  --sun:#FFC93C; --on-sun:#171230; --sun-edge:#A87400; --sun-soft:rgba(255,201,60,.30);
  --tomato:#FF6B55; --on-tomato:#210A05; --tomato-edge:#A12612;
  --teal:#2DD4BF; --on-teal:#04201C; --teal-edge:#0B7F72;
  --cobalt:#8A97FF; --pink:#FF9BC8;
  --ok:#3FE0AE; --warn:#FFC93C; --bad:#FF8570;
  --stroke:rgba(0,0,0,.55); --blob:.3;
  --p0:#FF6B55; --p1:#FFC93C; --p2:#2DD4BF; --p3:#8A97FF; --p4:#FF9BC8;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:10px}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Décor de fond ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob);animation:drift 28s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:var(--pink)}
.b2{width:38vmax;height:38vmax;right:-10vmax;top:4vmax;background:var(--sun);animation-delay:-9s}
.b3{width:44vmax;height:44vmax;left:16vmax;bottom:-26vmax;background:var(--teal);animation-delay:-15s}
.b4{width:30vmax;height:30vmax;right:-8vmax;bottom:-10vmax;background:var(--cobalt);animation-delay:-4s}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.8px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 85%);mask-image:linear-gradient(180deg,#000 0,transparent 85%)}
.toy{position:absolute;color:var(--ink);opacity:.5;animation:floaty 9s ease-in-out infinite alternate}
.toy svg{display:block;width:100%;height:100%;overflow:visible}
.toy-die{width:84px;height:84px;right:7%;top:150px;--r:14deg}
.toy-hex{width:110px;height:110px;left:3%;top:46%;--r:-10deg;animation-delay:-3s}
.toy-meeple{width:92px;height:92px;right:4%;bottom:16%;--r:-12deg;animation-delay:-6s;color:var(--tomato)}
.toy-die2{width:52px;height:52px;left:11%;bottom:9%;--r:24deg;animation-delay:-2s}
@keyframes drift{to{transform:translate3d(5vmax,3vmax,0) scale(1.08)}}
@keyframes floaty{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-16px) rotate(calc(var(--r,0deg) + 7deg))}}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- Structure ---------- */
.app{position:relative;z-index:1;padding-bottom:56px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,36px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.45);backdrop-filter:blur(18px) saturate(1.45);border:1px solid var(--edge);border-radius:26px;box-shadow:0 20px 44px -22px var(--shadow),inset 0 1px 0 var(--hl)}
.glass-2{border-radius:26px;background:var(--glass-2);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--edge);box-shadow:0 22px 50px -20px var(--shadow),inset 0 1px 0 var(--hl)}

/* En-tête : le verre est sur le ::before pour que la barre de navigation mobile (fixe) ne soit pas piégée dans un filtre */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-top:12px}
.top-in{position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 12px;min-height:62px}
.top-in::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:24px;background:var(--glass-2);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--edge);box-shadow:0 14px 34px -18px var(--shadow),inset 0 1px 0 var(--hl)}
.logo{display:flex;align-items:center;gap:10px;border-radius:14px}
.logo-mark{width:42px;height:42px;border-radius:14px;background:var(--sun);border:2px solid var(--stroke);box-shadow:0 3px 0 var(--sun-edge);display:grid;place-items:center;color:#15132E;transform:rotate(-6deg);transition:transform .2s}
.logo:hover .logo-mark{transform:rotate(6deg) scale(1.06)}
.logo-mark svg{width:26px;height:26px}
.logo-word{font:800 22px/1 var(--font-d);letter-spacing:-.03em}
.logo-word i{font-style:normal;color:var(--tomato)}
.navbar{margin-inline:auto}
.nav{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--hair)}
.nav button{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:14px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.mepill{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--hair);border:2px solid transparent;transition:border-color .15s,background .15s}
.mepill:focus-within{border-color:var(--cobalt);background:var(--glass-2)}
.mepill.shake{animation:shake .45s}
.mepill input{width:132px;border:0;outline:0;background:none;font-weight:600}
.mepill input::placeholder{color:var(--muted);font-weight:500}
.av{--c:var(--p0);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--font-d);color:var(--ink);background:var(--glass-2);background:color-mix(in srgb,var(--c) 30%,var(--glass-2));border:2px solid var(--c)}
.av.sm{width:38px;height:38px;font-size:16px}
.av-l{display:block;position:relative;top:.015em;font-style:normal;text-box:trim-both cap alphabetic}   /* la lettre est centrée sur sa hauteur de capitale, quelle que soit la police */
.who.gal{gap:16px 10px}
.who.gal>span{flex-direction:column;background:none;padding:0;width:76px;gap:6px;text-align:center;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.who.gal>span .av{width:68px;height:68px;font-size:26px;border-width:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.who.gal>span.me{background:none;color:inherit;font-weight:800}
.who.gal>span.me .av{box-shadow:0 0 0 4px var(--teal)}
.av.has-photo{padding:0;overflow:hidden;background:var(--c)}
.av.has-photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;-webkit-user-drag:none;user-select:none}
.prof-av{position:relative;flex:none}
.prof-cam{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);border:3px solid var(--bg);cursor:pointer;box-shadow:0 4px 12px rgba(20,16,50,.28);transition:transform .15s}
.prof-cam:hover,.prof-cam:focus-visible{transform:scale(1.1)}
.prof-cam .ic{display:block}
.ph-sheet{width:min(420px,100%);text-align:center}
.ph-sheet h2{margin:0 0 6px}
.ph-prev{display:grid;place-items:center;margin:18px 0 14px}
.av.ph-big{width:168px;height:168px;font-size:76px;border-width:5px;box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 22%,transparent),0 14px 30px rgba(20,16,50,.2)}
.ph-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.ph-btns .btn{cursor:pointer}
.ph-err{color:var(--red,#d1322f);font-weight:700;margin:0 0 8px}
.ph-foot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:20px}
@media (max-width:520px){.ph-btns .btn{width:100%}.av.ph-big{width:150px;height:150px}}
main{padding-block:28px 24px;min-height:70vh}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;padding-block:8px 12px}
.foot button{text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* ---------- Boutons ---------- */
.btn{--b:var(--sun);--on:var(--on-sun);--e:var(--sun-edge);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:16px;border:2px solid var(--stroke);background:var(--b);color:var(--on);box-shadow:0 5px 0 var(--e);font:700 15px/1.1 var(--font-b);letter-spacing:.01em;text-align:center;transition:transform .12s,box-shadow .12s,filter .12s}
.btn::after{content:"";position:absolute;inset:2px 2px 52% 2px;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--e)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--e)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--e);filter:grayscale(.5)}
.btn-lg{padding:17px 28px;font-size:16.5px;border-radius:18px}
.btn-sm{padding:9px 14px;font-size:13.5px;border-radius:13px;box-shadow:0 3px 0 var(--e)}
.btn-sm:hover{box-shadow:0 5px 0 var(--e)}
.btn-red{--b:var(--tomato);--on:var(--on-tomato);--e:var(--tomato-edge)}
.btn-teal{--b:var(--teal);--on:var(--on-teal);--e:var(--teal-edge)}
.btn-glass{--b:var(--glass-2);--on:var(--ink);--e:var(--hair);border-color:var(--hair)}
.btn-glass::after{display:none}
.btn-block{width:100%}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:10px}
.link:hover{color:var(--ink)}
.link.danger{color:var(--bad)}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--hair);font-weight:700;font-size:12.5px;color:var(--muted);transition:background .15s,color .15s}
.chip-btn:hover{background:var(--glass-2);color:var(--ink)}
.chip-btn.on{background:var(--tomato);color:var(--on-tomato)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:var(--muted);background:var(--hair);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--tomato);color:var(--on-tomato)}

/* ---------- Pastilles ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font:700 12px/1 var(--font-b);letter-spacing:.04em;text-transform:uppercase;background:var(--hair);color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-open{color:var(--ok);background:rgba(11,138,104,.14)}
.pill-full{color:var(--bad);background:rgba(207,46,23,.14)}
.pill-closed{color:var(--muted)}
.pill-pub{color:var(--cobalt);background:rgba(42,69,230,.13)}
.pill-me{color:var(--on-teal);background:var(--teal)}
.pill-me::before{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill-open{background:rgba(63,224,174,.15)}:root:not([data-theme="light"]) .pill-full{background:rgba(255,133,112,.16)}:root:not([data-theme="light"]) .pill-pub{background:rgba(138,151,255,.18)}}
:root[data-theme="dark"] .pill-open{background:rgba(63,224,174,.15)}
:root[data-theme="dark"] .pill-full{background:rgba(255,133,112,.16)}
:root[data-theme="dark"] .pill-pub{background:rgba(138,151,255,.18)}

/* ---------- Boîte de jeu ---------- */
.box{position:relative;aspect-ratio:300/340;border-radius:5px 13px 13px 5px;overflow:hidden;background:#222;box-shadow:0 16px 26px -12px rgba(10,10,40,.6),0 2px 0 rgba(0,0,0,.22)}
.box svg{display:block;width:100%;height:100%}
.box::before{content:"";position:absolute;inset:0 auto 0 0;width:7%;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.2) 62%,rgba(0,0,0,.08))}
.box::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.3) 0,transparent 34%,transparent 68%,rgba(0,0,0,.2))}

/* ---------- Accueil ---------- */
.intro{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center;margin-bottom:46px}
.eyebrow{font:700 12px/1 var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.eyebrow::before{content:"";width:28px;height:3px;border-radius:3px;background:var(--tomato)}
h1{font:800 clamp(2.4rem,5.4vw,4.3rem)/.98 var(--font-d);letter-spacing:-.035em;text-wrap:balance}
.mark{background:linear-gradient(104deg,var(--sun) 0 100%) 0 62%/100% 34% no-repeat;color:var(--ink);padding-inline:.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lede{font-size:clamp(1rem,1.5vw,1.15rem);color:var(--muted);max-width:46ch;margin-top:20px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.steps li{display:flex;flex-direction:column;gap:4px;padding:13px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.steps b{display:flex;align-items:center;gap:8px;font:700 14px/1.2 var(--font-d)}
.steps b i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:800 12px/1 var(--font-d);flex:none}
.steps span{font-size:12.5px;color:var(--muted)}
.hero-fan{position:relative;height:390px}
.hf{position:absolute;bottom:8px;left:50%;width:min(176px,34%);transform:translateX(calc(-50% + var(--x)*var(--k,1)*1px)) rotate(calc(var(--r)*1deg));transform-origin:50% 120%;transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.hero-fan:hover .hf{transform:translateX(calc(-50% + var(--x)*var(--k,1)*1.18px)) rotate(calc(var(--r)*1.25deg))}
.hf:nth-child(3){z-index:3}.hf:nth-child(2),.hf:nth-child(4){z-index:2}
.hero-fan .meeple-float{position:absolute;right:2%;top:2%;width:84px;height:84px;color:var(--tomato);transform:rotate(14deg);filter:drop-shadow(0 8px 0 rgba(0,0,0,.18));animation:floaty 7s ease-in-out infinite alternate}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
h2{font:800 clamp(1.5rem,2.6vw,2rem)/1.05 var(--font-d);letter-spacing:-.025em}
.sec-head p{color:var(--muted);font-size:14px}

/* Billet de session */
.ticket{--tw:76px;display:inline-flex;flex-direction:column;align-items:center;width:var(--tw);padding:10px 8px 11px;background:var(--sun);color:#15132E;-webkit-mask:radial-gradient(circle 8px at 0 64%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 64%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 8px at 0 64%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 64%,#0000 97%,#000) right/51% 100% no-repeat;border-radius:16px;line-height:1}
.ticket .t-wd{font:700 11px/1 var(--font-b);letter-spacing:.14em;text-transform:uppercase}
.ticket .t-day{font:800 38px/1 var(--font-d);letter-spacing:-.04em;margin:3px 0 1px}
.ticket .t-mo{font:700 11px/1 var(--font-b);letter-spacing:.14em;text-transform:uppercase}
.ticket .t-time{margin-top:8px;padding-top:8px;border-top:2px dashed rgba(21,19,46,.35);width:100%;text-align:center;font:800 14px/1 var(--font-d)}
.ticket.big{--tw:96px}.ticket.big .t-day{font-size:50px}
.ticket.mini{--tw:58px;padding:7px 6px 8px;border-radius:12px}.ticket.mini .t-day{font-size:26px}.ticket.mini .t-time{margin-top:5px;padding-top:5px;font-size:12px}

/* Cartes de session */
.grid-sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:22px}
.scard{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:20px;animation:rise .5s both}
.scard:nth-child(2){animation-delay:.07s}.scard:nth-child(3){animation-delay:.14s}.scard:nth-child(4){animation-delay:.21s}
.scard-bg,.gcard-bg{position:absolute;inset:-40px;z-index:-2;background:var(--bgimg) center/cover;filter:blur(34px) saturate(1.4);opacity:.5;transform:scale(1.15)}
.scard::after,.gcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 20%,var(--glass) 78%)}
.scard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scard-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fan{position:relative;height:150px;margin-top:2px;container-type:inline-size}
.fan-i{--sp:min(70px,calc((100vw - 250px)/var(--d,1)));--sp2:min(88px,calc((100vw - 250px)/var(--d,1)));position:absolute;left:50%;bottom:0;width:98px;transform:translateX(calc(-50% + (var(--j) - (var(--n) - 1)/2)*var(--sp))) rotate(calc((var(--j) - (var(--n) - 1)/2)*9deg));transform-origin:50% 120%;transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
@supports (width:1cqw){.fan-i{--sp:min(70px,calc((100cqw - 200px)/var(--d,1)));--sp2:min(88px,calc((100cqw - 200px)/var(--d,1)))}}
.scard:hover .fan-i{transform:translateX(calc(-50% + (var(--j) - (var(--n) - 1)/2)*var(--sp2))) rotate(calc((var(--j) - (var(--n) - 1)/2)*12deg)) translateY(-6px)}
.scard-games{font:700 15px/1.3 var(--font-d);text-align:center;text-wrap:balance}
.seats-row{display:flex;flex-direction:column;gap:8px;align-items:center}
.seat-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.seat{--c:var(--p0);width:19px;height:19px;color:var(--c);opacity:.24}
.seat.on{opacity:1}
.seat-num{font-size:13px;color:var(--muted)}
.seat-num b{color:var(--ink);font:800 16px/1 var(--font-d)}

/* ---------- Page session ---------- */
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);padding:8px 12px 8px 8px;border-radius:12px;margin-bottom:12px;background:var(--hair)}
.back:hover{color:var(--ink)}
.sess-head{display:flex;flex-wrap:wrap;align-items:center;gap:18px 22px;margin-bottom:26px}
.sess-head h1{font-size:clamp(2rem,4.6vw,3.3rem)}
.sess-head .sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);margin-top:10px;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.panel{padding:24px}
.panel+.panel{margin-top:20px}
.panel-head{margin-bottom:18px;display:flex;flex-direction:column;gap:6px}
.panel-head p{color:var(--muted);max-width:60ch}
.rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr));gap:18px}
.rcard{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;padding:14px;border-radius:22px;background:var(--glass-2);border:2px solid var(--hair);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.rcard:hover{transform:translateY(-3px);border-color:var(--muted)}
.rcard.is-ranked{border-color:var(--sun);box-shadow:0 0 0 5px var(--sun-soft)}
.rcard.is-last{border-style:dashed;border-color:var(--cobalt)}
.rcard-box{position:relative;align-self:start}
.rank-badge{position:absolute;top:-12px;left:-12px;z-index:5;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--on-sun);border:2px solid var(--stroke);box-shadow:0 3px 0 var(--sun-edge);font:800 21px/1 var(--font-d);transform:scale(0);transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
.is-ranked .rank-badge,.is-veto .rank-badge,.is-last .rank-badge{transform:scale(1)}
.is-last .rank-badge{background:var(--glass-2);color:var(--cobalt);border:2px dashed var(--cobalt);box-shadow:none}
.is-veto .rank-badge{background:var(--tomato);color:var(--on-tomato);box-shadow:0 3px 0 var(--tomato-edge)}
.is-veto .rcard-box .box{filter:grayscale(1);opacity:.45}
.is-veto h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.rcard-body{display:flex;flex-direction:column;gap:8px;min-width:0}
h3{font:800 19px/1.15 var(--font-d);letter-spacing:-.02em}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-weight:600}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts b{color:var(--ink)}
.sum{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.actionbar{position:sticky;bottom:18px;z-index:20;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 14px 14px 22px;border-radius:24px}
.progress{display:flex;flex-direction:column;gap:7px;min-width:0}
.progress strong{font:800 15px/1.1 var(--font-d)}
.dots-row{display:flex;gap:6px;flex-wrap:wrap}
.dots-row i{width:22px;height:8px;border-radius:6px;background:var(--hair);transition:background .2s}
.dots-row i.on{background:var(--teal)}
.dots-row i.no{background:var(--tomato)}
.ok-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ok-ico{width:46px;height:46px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none;border:2px solid var(--stroke);box-shadow:0 3px 0 var(--teal-edge)}
.mychoices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:12px;margin-bottom:20px}
.mychoices li{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:18px;background:var(--glass-2);border:1px solid var(--hair)}
.mychoices .mini{position:relative;width:48px;flex:none}
.mychoices strong{font:700 15px/1.2 var(--font-d)}
.mychoices .nope strong{text-decoration:line-through;color:var(--muted)}
.mini-badge{position:absolute;top:-8px;left:-8px;z-index:4;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--on-sun);border:2px solid var(--stroke);font:800 12px/1 var(--font-d)}
.mini-badge.no{background:var(--tomato);color:var(--on-tomato)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.aside{display:flex;flex-direction:column;gap:20px;position:sticky;top:96px}
.aside .panel+.panel{margin-top:0}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--hair) 0);display:grid;place-items:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:var(--glass-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font:800 28px/1 var(--font-d);letter-spacing:-.03em}
.ring span{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ring.full{background:conic-gradient(var(--tomato) 100%,var(--hair) 0)}
.gauge{display:flex;gap:16px;align-items:center}
.gauge p{font-size:13.5px;color:var(--muted)}
.gauge p b{color:var(--ink)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{display:inline-flex;align-items:center;gap:9px;padding:4px 14px 4px 4px;border-radius:999px;background:var(--hair);font-weight:600;font-size:13.5px}
.who span.me{background:var(--teal);color:var(--on-teal)}
.who span.av{display:grid;gap:0;padding:0;font-size:16px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--c) 30%,var(--glass-2))}   /* l'avatar n'hérite pas du style des pastilles */
.who span.av.has-photo{background:var(--c)}
.small-h{font:800 12px/1 var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.rules{display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--muted)}
.rules li{display:flex;gap:10px}
.rules li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--tomato);margin-top:7px;transform:rotate(45deg)}
.rules li:nth-child(2)::before{background:var(--sun)}.rules li:nth-child(3)::before{background:var(--teal)}.rules li:nth-child(4)::before{background:var(--cobalt)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 16px;color:var(--muted)}
.empty svg.meeple{width:56px;height:56px;color:var(--hair)}

/* ---------- Tables composées ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin-bottom:20px}
.stat{padding:14px 16px;border-radius:20px;background:var(--glass-2);border:1px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.stat b{font:800 30px/1 var(--font-d);letter-spacing:-.03em}
.stat b small{font-size:16px;color:var(--muted);font-weight:700}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:20px}
.tcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:24px;background:var(--glass-2);border:2px solid var(--hair)}
.pop-in{animation:pop .45s both}
.tcard.mine{border-color:var(--teal);box-shadow:0 0 0 5px rgba(10,154,137,.18)}
.tcard.warn{border-color:var(--tomato)}
.ribbon{position:absolute;top:-13px;right:18px;padding:6px 13px;border-radius:999px;background:var(--teal);color:var(--on-teal);border:2px solid var(--stroke);font:800 12px/1 var(--font-b);letter-spacing:.08em;text-transform:uppercase}
.tcard-head{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center}
.tcard-head h3{font-size:21px}
.tstate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:4px}
.tstate.ok{color:var(--ok)}.tstate.bad{color:var(--bad)}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:999px;background:var(--hair);font-weight:600;font-size:14px;transition:background .15s,transform .15s}
button.pchip:hover{background:var(--sun-soft);transform:translateY(-1px)}
.pchip.me{background:var(--teal);color:var(--on-teal)}
.rk{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 11px/1 var(--font-d);background:var(--ok);color:#fff}
.rk.r2{background:var(--sun);color:#15132E}
.rk.r3{background:var(--tomato);color:var(--on-tomato)}
.rk.r3p{background:var(--bad);color:var(--on-tomato)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rk{color:#04201C}}
:root[data-theme="dark"] .rk{color:#04201C}
.tcard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.drop-note{border:2px dashed var(--hair);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.drop-note p{font-size:13.5px;color:var(--muted)}
.notretained{display:flex;flex-direction:column;gap:8px;margin-top:20px;font-size:13.5px;color:var(--muted)}
.notretained li{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--hair)}
.notretained .mini{width:34px;flex:none;opacity:.6}
.notretained b{color:var(--ink);font-weight:700}
.admin-bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:22px 0 4px}

/* ---------- Ludothèque ---------- */
.search{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:var(--glass-2);border:2px solid var(--hair);min-width:min(320px,100%)}
.search:focus-within{border-color:var(--cobalt)}
.search input{border:0;outline:0;background:none;width:100%;font-weight:600}
.search input::placeholder{color:var(--muted);font-weight:500}
.grid-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(224px,100%),1fr));gap:20px}
.gcard{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:20px 18px 18px;border-radius:26px;text-align:left;animation:rise .5s both;transition:transform .2s}
.gcard:hover{transform:translateY(-5px)}
.gcard-box{width:68%;margin:6px auto 4px;transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.gcard:hover .gcard-box{transform:perspective(600px) rotateY(-14deg) translateY(-4px)}
.gcard h3{font-size:19px}

/* ---------- Fenêtre modale ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:26px;border-radius:30px;animation:pop .3s both}
.sheet-x{position:absolute;top:14px;right:14px}
.sheet-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;align-items:start}
.sheet h2{font-size:clamp(1.7rem,3.6vw,2.4rem);margin-bottom:12px}
.sheet .facts{font-size:14px;gap:8px 16px;margin-bottom:16px}
.sheet .full{font-size:15px;line-height:1.6;color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tags span{padding:5px 11px;border-radius:999px;background:var(--hair);font-size:12.5px;font-weight:700}
.credit{font-size:12.5px;color:var(--muted);margin-top:16px}
.weight{display:inline-flex;gap:3px;vertical-align:middle}
.weight i{width:9px;height:9px;border-radius:50%;background:var(--hair)}
.weight i.on{background:var(--cobalt)}
.moves{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.moves .btn{justify-content:space-between}

/* ---------- Admin ---------- */
.gate{max-width:440px;margin:6vh auto 0;padding:30px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.gate .ok-ico{width:64px;height:64px;background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 var(--sun-edge);transform:rotate(-6deg)}
.gate .shake{animation:shake .45s}
.field{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.field>label,.label{font:800 12px/1 var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;padding:13px 15px;border-radius:15px;background:var(--glass-2);border:2px solid var(--hair);outline:0;font-weight:600;transition:border-color .15s}
.input:focus{border-color:var(--cobalt)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:18px;background:var(--hair);flex-wrap:wrap}
.seg button{padding:10px 18px;border-radius:14px;font-weight:700;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.admin-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}
.arows{display:flex;flex-direction:column;gap:14px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:16px 18px;border-radius:24px}
.arow .minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.arow .minis .box{width:38px}
.arow h3{font-size:18px}
.arow-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.form{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(120px,100%),1fr));gap:14px;margin-top:10px}
.ptile{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:20px;border:2px solid var(--hair);background:var(--glass-2);text-align:center;transition:transform .15s,border-color .15s}
.ptile:hover{transform:translateY(-3px)}
.ptile strong{font:700 13px/1.2 var(--font-d)}
.ptile small{color:var(--muted);font-size:12px;font-weight:600}
.ptile .tick{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--on-teal);border:2px solid var(--stroke);display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.7,.5,1);z-index:5}
.ptile[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,154,137,.2)}
.ptile[aria-pressed="true"] .tick{transform:scale(1)}
.sumbox{padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:96px}
.sumbox .big{font:800 56px/1 var(--font-d);letter-spacing:-.04em}
.sumbox .big small{font-size:18px;color:var(--muted);font-weight:700;letter-spacing:0}
.eq{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.eq b{color:var(--ink)}
.glist{display:flex;flex-direction:column;gap:12px}
.gtools{display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
.gtools .search{min-width:0;flex:1 1 260px}
.flt-open{position:relative;gap:8px;white-space:nowrap}
.flt-open.on{border-color:var(--stroke);background:var(--sun);color:var(--on-sun)}
.flt-badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--bg);font:800 12px/1 var(--font-b);animation:pop .3s both}
.flt-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.flt-sum[hidden]{display:none}
.flt-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;border-radius:999px;border:2px solid var(--stroke);background:var(--sun);color:var(--on-sun);font:800 13px/1 var(--font-b);cursor:pointer;animation:pop .25s both}
.flt-tag svg{opacity:.7}
.flt-tag:hover svg{opacity:1}
.flt-n{margin:-4px 0 14px;color:var(--muted);font-weight:700;font-size:13px}.flt-n:empty{display:none}
.flt-c{display:flex;gap:8px;flex-wrap:wrap}
.flt-b{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:10px 16px;border-radius:16px;border:2px solid var(--hair);background:var(--glass-2);font:800 15px/1 var(--font-b);color:var(--ink);cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}
.flt-b small{font:600 11px/1.2 var(--font-b);color:var(--muted)}
.flt-b:hover{transform:translateY(-1px)}
.flt-b:active{transform:scale(.96)}
.flt-b[aria-pressed="true"]{background:var(--sun);color:var(--on-sun);border-color:var(--stroke);box-shadow:0 3px 0 var(--sun-edge)}
.flt-b[aria-pressed="true"] small{color:var(--on-sun);opacity:.8}
.flt-c-w .flt-b{flex:1 1 140px;align-items:flex-start;text-align:left}
.fsheet{width:min(560px,100%);padding:0;display:flex;flex-direction:column;overflow:hidden;animation:fsIn .38s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes fsIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.fs-grip{display:none;width:44px;height:5px;border-radius:3px;background:var(--hair);margin:10px auto 0}
.fs-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px}
.fs-head h2{margin:0;font-size:clamp(1.4rem,3vw,1.8rem)}
.fs-body{overflow:auto;padding:6px 22px 14px;display:flex;flex-direction:column;gap:20px}
.fs-sec{animation:rise .45s both}.fs-sec:nth-child(2){animation-delay:.07s}.fs-sec:nth-child(3){animation-delay:.14s}
.fs-t{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;font:800 13px/1.2 var(--font-b);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fs-t small{font:600 12px/1.2 var(--font-b);letter-spacing:0;text-transform:none;opacity:.8}
.fs-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px 18px;border-top:1px solid var(--hair)}
.fs-foot .link:disabled{opacity:.4;pointer-events:none}
@media (max-width:640px){
  .fm{place-items:end center;padding:0}
  .fsheet{width:100%;max-height:86%;border-radius:28px 28px 0 0;animation:fsUp .42s cubic-bezier(.2,.9,.3,1) both;padding-bottom:env(safe-area-inset-bottom)}
  .fs-grip{display:block}
  .gtools{width:100%}.gtools .search{flex:1 1 0;min-width:0}
}
@keyframes fsUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.fsheet,.fs-sec,.flt-tag,.flt-badge{animation:none}}
.nt-seg{margin-bottom:0;display:flex;flex-wrap:nowrap}
.nt-seg button{flex:1 1 0;justify-content:center;padding-left:10px;padding-right:10px;white-space:nowrap}
.nt-ses-sel{width:100%}
.nt-ses{margin-top:10px;padding:12px 14px;border-radius:16px;border:2px solid var(--hair);background:var(--glass-2)}
.nt-ses-d{display:flex;flex-direction:column;gap:2px}

.range{width:100%;-webkit-appearance:none;appearance:none;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--teal),var(--sun),var(--tomato));outline-offset:6px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--glass-2);border:3px solid var(--stroke);box-shadow:0 3px 0 var(--sun-edge);cursor:grab}

/* Toast */

.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

.copyrow code.bigcode{font:800 1.5rem/1.1 var(--font-d);letter-spacing:.14em;background:var(--sun-soft)}
.team .label{display:block}
.mini-out[hidden],.role-tag[hidden]{display:none}
.auth .seg button{white-space:nowrap;font-size:14px}
.mepill{min-width:0}
.logo{flex:0 0 auto}

<script>
/* Moteur d'affectation.
   Pour chaque combinaison de tables possibles, un flot à coût minimal place les joueurs :
   - chaque joueur va à une seule table, jamais sur un jeu refusé ;
   - une table ouverte doit atteindre son minimum de joueurs (sinon la combinaison est écartée) ;
   - le regret croît vite avec le rang (1er choix = 0, 2e = 2, 3e = 6...) pour répartir les déceptions ;
   - dépasser le nombre idéal coûte de plus en plus cher ;
   - chaque table ouverte a un coût : plus il est élevé, moins il y a de tables ;
   - option single : une seule table (un seul jeu retenu), celui qui convient le mieux au nombre de joueurs et à leurs préférences. */
(function (root) {
  var PLACE = 10000, BONUS = 2000000, DEV = 8, EPS = 1e-9;

  function rankIn(p, gid) {
    var i = p.order.indexOf(gid);
    if (i >= 0) return i + 1;
    if (p.veto && p.veto.indexOf(gid) >= 0) return 0;
    return p.order.length + 1;
  }
  function regret(r) { return (r - 1) * r; }

  function mcf(N, s, t, edges, need) {
    var to = [], cap = [], cost = [], nxt = [], head = [], ids = [], i;
    for (i = 0; i < N; i++) head.push(-1);
    function add(u, v, c, w) {
      to.push(v); cap.push(c); cost.push(w); nxt.push(head[u]); head[u] = to.length - 1;
      to.push(u); cap.push(0); cost.push(-w); nxt.push(head[v]); head[v] = to.length - 1;
      return to.length - 2;
    }
    for (i = 0; i < edges.length; i++) ids.push(add(edges[i][0], edges[i][1], edges[i][2], edges[i][3]));
    var flow = 0;
    while (flow < need) {
      var dist = [], inq = [], pe = [];
      for (i = 0; i < N; i++) { dist.push(Infinity); inq.push(false); pe.push(-1); }
      dist[s] = 0; var q = [s]; inq[s] = true;
      while (q.length) {
        var u = q.shift(); inq[u] = false;
        for (var e = head[u]; e !== -1; e = nxt[e]) {
          if (cap[e] > 0 && dist[u] + cost[e] < dist[to[e]] - EPS) {
            dist[to[e]] = dist[u] + cost[e]; pe[to[e]] = e;
            if (!inq[to[e]]) { inq[to[e]] = true; q.push(to[e]); }
          }
        }
      }
      if (dist[t] === Infinity) break;
      var v = t;
      while (v !== s) { var ed = pe[v]; cap[ed] -= 1; cap[ed ^ 1] += 1; v = to[ed ^ 1]; }
      flow++;
    }
    return { cap: cap, ids: ids };
  }

  function idealOf(g) { return Math.max(g.min, Math.min(g.ideal, g.max)); }

  function assign(players, games, S, tablePen) {
    var n = players.length, k = S.length, src = 0, snk = n + k + 1, edges = [], pg = [], i, a;
    for (i = 0; i < n; i++) {
      edges.push([src, 1 + i, 1, 0]);
      edges.push([1 + i, snk, 1, 0]);
      var w = 1 - i / (n * 1000); /* à égalité, les premiers inscrits sont un peu mieux servis */
      var wt = players[i].weight == null ? 1 : players[i].weight; /* poids de l'insatisfaction (1 = normal ; un malus d'absence le réduit : la personne passe après ; l'équité dans le temps peut l'augmenter jusqu'à 1,6) */
      for (a = 0; a < k; a++) {
        var r = rankIn(players[i], games[S[a]].id);
        if (r > 0) { pg.push([i, a, edges.length]); edges.push([1 + i, n + 1 + a, 1, -PLACE + regret(r) * w * wt]); }
      }
    }
    for (a = 0; a < k; a++) {
      var g = games[S[a]], ideal = idealOf(g);
      for (var j = 1; j <= g.max; j++) {
        edges.push([n + 1 + a, snk, 1, j <= g.min ? -BONUS : (j <= ideal ? 0 : DEV * (j - ideal))]);
      }
    }
    var out = mcf(n + k + 2, src, snk, edges, n);
    var asg = [], cnt = [];
    for (i = 0; i < n; i++) asg.push(-1);
    for (a = 0; a < k; a++) cnt.push(0);
    pg.forEach(function (x) { if (out.cap[out.ids[x[2]]] === 0) { asg[x[0]] = x[1]; cnt[x[1]]++; } });
    for (a = 0; a < k; a++) if (cnt[a] < games[S[a]].min) return null;
    var placed = 0, reg = 0, dev = 0;
    for (i = 0; i < n; i++) if (asg[i] >= 0) { placed++; reg += regret(rankIn(players[i], games[S[asg[i]]].id)) * (players[i].weight == null ? 1 : players[i].weight); }
    for (a = 0; a < k; a++) { var over = cnt[a] - idealOf(games[S[a]]); if (over > 0) dev += DEV * over * (over + 1) / 2; }
    return { S: S, asg: asg, score: placed * PLACE - reg - dev - tablePen * k };
  }

  /* players : [{name, order:[gid], veto:[gid], weight?}]   games : [{id, min, max, ideal}] */
  function solve(players, games, opts) {
    var tablePen = opts && opts.tablePenalty != null ? opts.tablePenalty : 30;
    var out = { tables: [], unplaced: [], notes: {} }, i;
    if (!players.length || !games.length) { out.unplaced = players.map(function (p) { return p.name; }); return out; }
    var elig = games.map(function (g) { return players.filter(function (p) { return rankIn(p, g.id) > 0; }).length; });
    var cand = [];
    games.forEach(function (g, ix) { if (elig[ix] >= g.min) cand.push(ix); });
    var m = cand.length, maxSize = opts && opts.single ? 1 : (m > 10 ? 4 : m), best = null;
    for (var mask = 1; mask < (1 << m); mask++) {
      var S = [];
      for (i = 0; i < m; i++) if (mask & (1 << i)) S.push(cand[i]);
      if (S.length > maxSize) continue;
      var r = assign(players, games, S, tablePen);
      if (!r) continue;
      if (!best || r.score > best.score + 1e-9 || (Math.abs(r.score - best.score) <= 1e-9 && r.S.length < best.S.length)) best = r;
    }
    games.forEach(function (g, ix) {
      if (best && best.S.indexOf(ix) >= 0) return;
      out.notes[g.id] = elig[ix] < g.min
        ? 'Seulement ' + elig[ix] + ' joueur' + (elig[ix] > 1 ? 's' : '') + ' intéressé' + (elig[ix] > 1 ? 's' : '') + ', ' + g.min + ' minimum'
        : (opts && opts.single ? 'Un autre jeu convient mieux au groupe' : 'Les joueurs sont mieux placés sur d’autres tables');
    });
    if (!best) { out.unplaced = players.map(function (p) { return p.name; }); return out; }
    best.S.slice().sort(function (x, y) { return x - y; }).forEach(function (gi) {
      var a = best.S.indexOf(gi), g = games[gi], names = [];
      players.forEach(function (p, pi) { if (best.asg[pi] === a) names.push({ n: p.name, r: rankIn(p, g.id), i: pi }); });
      names.sort(function (x, y) { return x.r - y.r || x.i - y.i; });
      out.tables.push({ gid: g.id, names: names.map(function (x) { return x.n; }) });
    });
    players.forEach(function (p, pi) { if (best.asg[pi] < 0) out.unplaced.push(p.name); });
    return out;
  }

  var api = { solve: solve, rankIn: rankIn };
  root.Engine = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* Jeux d'Oliv : couche Supabase (comptes + base partagée).
   Expose window.Backend. Le reste de l'appli parle à une "db" minimale (collection / doc)
   qui est stockée dans la table public.kv (voir supabase-setup.sql). */
(function () {
  'use strict';
  var CFG = window.JDO_CONFIG || {};
  var B = window.Backend = { sb: null, configured: !!(CFG.url && CFG.key && /^https:\/\//.test(CFG.url)) };
  var sb = null;
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  function friendly(e) {
    var m = String((e && (e.message || e.error_description)) || e || ''), c = e && (e.code || e.error_code);
    if (/invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
    if (/email not confirmed/i.test(m)) return 'Votre e-mail n’est pas encore confirmé : ouvrez le message reçu.';
    if (c === 'user_already_exists' || /already registered|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail : connectez-vous.';
    if (c === 'weak_password' || /password should be|at least \d+ char/i.test(m)) return 'Mot de passe trop court (6 caractères minimum).';
    if (/rate limit|too many|security purposes/i.test(m)) return 'Trop de tentatives. Réessayez dans quelques minutes.';
    if (/signups? not allowed|signup is disabled/i.test(m)) return 'La création de compte est fermée pour le moment.';
    if (/invalid.*email|unable to validate email/i.test(m)) return 'Cette adresse e-mail n’est pas valide.';
    if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Connexion impossible : vérifiez votre réseau.';
    return 'Une erreur est survenue (' + m.slice(0, 80) + ').';
  }
  B.friendly = friendly;

  function userOf(u) {
    var md = (u && u.user_metadata) || {};
    return { id: u.id, email: u.email || '', name: String(md.name || '').trim() };
  }

  /* ---------- Démarrage / session ---------- */
  B.start = async function () {
    if (!B.configured) return { state: 'config' };
    if (!window.supabase || !window.supabase.createClient) return { state: 'lib' };
    try {
      sb = B.sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
      /* lien reçu par e-mail (mot de passe oublié) : la session est dans l'adresse, après le # */
      var hash = String(location.hash || '');
      if (/[#&]type=recovery/.test(hash) && /access_token=/.test(hash)) {
        var hp = new URLSearchParams(hash.replace(/^#/, ''));
        var rs = await sb.auth.setSession({ access_token: hp.get('access_token') || '', refresh_token: hp.get('refresh_token') || '' });
        try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {}
        if (rs.error || !rs.data || !rs.data.session) return { state: 'out', linkError: 'Ce lien n’est plus valable (expiré ou déjà utilisé). Refaites une demande de mot de passe oublié.' };
        return { state: 'recovery', user: userOf(rs.data.session.user) };
      }
      if (/[#&]error(_code|_description)?=/.test(hash)) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {}
        return { state: 'out', linkError: 'Ce lien n’est plus valable (expiré ou déjà utilisé). Refaites une demande de mot de passe oublié.' };
      }
      var r = await sb.auth.getSession();
      var s = r && r.data && r.data.session;
      if (!s) return { state: 'out' };
      return { state: 'in', user: userOf(s.user) };
    } catch (e) { return { state: 'net', error: friendly(e) }; }
  };
  B.signIn = async function (email, pw) {
    try {
      var r = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (r.error) return { error: friendly(r.error) };
      return { user: userOf(r.data.user) };
    } catch (e) { return { error: friendly(e) }; }
  };
  B.signUp = async function (email, pw, name) {
    try {
      var r = await sb.auth.signUp({ email: email, password: pw, options: { data: { name: name } } });
      if (r.error) return { error: friendly(r.error) };
      if (r.data && r.data.user && r.data.user.identities && !r.data.user.identities.length) return { error: 'Un compte existe déjà avec cet e-mail : connectez-vous.' };
      if (!r.data.session) return { confirm: true };
      return { user: userOf(r.data.user) };
    } catch (e) { return { error: friendly(e) }; }
  };
  B.signOut = async function () { try { await sb.auth.signOut(); } catch (e) {} };
  B.status = async function () {
    try {
      var r = await sb.rpc('my_status');
      if (r.error) throw r.error;
      var d = r.data || {};
      return { admin: !!d.admin, member: !!d.member, organizer: !!d.organizer, groups: Array.isArray(d.groups) ? d.groups : [] };
    } catch (e) { return { error: friendly(e) }; }
  };
  /* true = bon code ; false = mauvais code ; 'limit' = 10 essais ratés en 24 h atteints */
  B.join = async function (code) {
    try {
      var r = await sb.rpc('join_team', { p_code: code });
      if (r.error) return /trop_d_essais/i.test(String(r.error.message || '') + String(r.error.hint || '')) ? 'limit' : false;
      return r.data === true;
    } catch (e) { return false; }
  };
  B.triesLeft = async function () {
    try { var r = await sb.rpc('join_tries_left'); return r.error || typeof r.data !== 'number' ? null : r.data; } catch (e) { return null; }
  };
  /* Messages lus (tchat) : une date de dernière lecture par session, enregistrée pour la personne et synchronisée entre ses appareils */
  B.chatReads = async function () {
    try {
      var r = await sb.rpc('chat_reads_get'); if (r.error || !Array.isArray(r.data)) return null;
      var m = {}; r.data.forEach(function (x) { m[x.sid] = Number(x.read_ts) || 0; }); return m;
    } catch (e) { return null; }
  };
  B.markChatRead = async function (sid, ts) {
    try { var r = await sb.rpc('chat_mark_read', { p_sid: sid, p_ts: ts }); return !r.error; } catch (e) { return false; }
  };
  B.resetPassword = async function (email) {
    try {
      var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      return r.error ? { error: friendly(r.error) } : { ok: true };
    } catch (e) { return { error: friendly(e) }; }
  };
  B.setPassword = async function (pw) {
    try {

        : '<div class="install-txt"><b>Installer Jeux d’Oliv</b><span>' + (ios ? 'Touchez <em>Partager</em> puis <em>Sur l’écran d’accueil</em>.' : 'Ouvrez le menu du navigateur (⋮) puis <em>Installer l’application</em>.') + '</span></div><div class="install-btns"><button class="btn btn-glass" type="button" data-i="no">OK</button></div>';
      box.innerHTML = '<img src="icon-192.png" alt="" width="46" height="46">' + body;
      box.addEventListener('click', function (e) {
        var t = e.target.closest('[data-i]'); if (!t) return;
        if (t.dataset.i === 'go' && ev) { var p = ev; ev = null; p.prompt(); (p.userChoice || Promise.resolve()).then(function () { hide(false); }); }
        else hide(true);
      });
      document.body.appendChild(box); requestAnimationFrame(function () { requestAnimationFrame(function () { if (box) box.classList.add('on'); }); });
    }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; setTimeout(show, 1500); });
    window.addEventListener('appinstalled', function () { ev = null; hide(false); });
    /* iOS (et navigateurs sans invite automatique) : explication après quelques secondes */
    setTimeout(function () { if (!ev && ios) show(); }, 4000);
  })();
  init();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
